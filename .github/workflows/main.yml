name: Build JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Gradle构建
        run: ./gradlew build --no-daemon

      - name: 运行打包脚本
        run: ./genJar.bat

      - name: 上传JAR产物
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider_jar
          path: jar/custom_spider.jar
