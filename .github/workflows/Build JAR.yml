name: Build JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装Android SDK
        uses: android-actions/setup-android@v3

      - name: 编译Java类
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: 打包JAR
        run: |
          mkdir -p build/tmp/jar
          cp -r app/build/intermediates/javac/debug/classes/* build/tmp/jar/
          cd build/tmp/jar
          jar cf ../../../custom_spider.jar .
          cd ../../..
          echo "已生成 custom_spider.jar"

      - name: 上传JAR产物
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider_jar
          path: custom_spider.jar
